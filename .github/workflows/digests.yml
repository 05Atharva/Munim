name: Munim digests

# IST = UTC+5:30. Run off the top of the hour to reduce GitHub queue delays.
on:
  schedule:
    - cron: "5 3 * * *"   # Morning every day at 08:35 IST
    - cron: "45 12 * * *" # Evening every day at 18:15 IST
    - cron: "30 4 * * 0"  # Weekly memory review on Sunday at 10:00 IST
  workflow_dispatch:
    inputs:
      task:
        description: "Choose check for a no-send readiness test"
        type: choice
        options: [check, morning, evening, consolidate]
        default: check

permissions:
  contents: read

concurrency:
  group: munim-digests
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: python -m pip install -r requirements-actions.txt
      - name: Run selected task
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          TASK: ${{ inputs.task }}
          APP_ENV: production
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
          LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || secrets.LLM_FALLBACK_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -eu
          if [ "$EVENT" = schedule ]; then
            case "$SCHEDULE" in
              "5 3 * * *") TASK=morning ;;
              "45 12 * * *") TASK=evening ;;
              "30 4 * * 0") TASK=consolidate ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
          fi
          case "$TASK" in
            check|morning|evening|consolidate) python -m bot.run "$TASK" ;;
            *) echo "Unsupported task" >&2; exit 1 ;;
          esac
